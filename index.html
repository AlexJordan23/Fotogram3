<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Fotogram</title>
    <link rel="icon" type="image/x-icon" href="./pictures/fotogramlogo.jpeg">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap');
    </style>

</head>

<body class="body_container">
    <header class="header_container">
        <div class="content_wrapper">
        <div class="logo-container">
            <img class="picture_logo" src="./pictures/fotogramlogo.jpeg" alt="Fotogram-Logo">
            <h2 class="fotogram_container">Fotogram</h2>
        </div>
        </div>
    </header>
    <main class="main_container">
        <div class="content_wrapper">

        
            <h1 class="album_title">Your personal photo album</h1>
                <div id="album_pictures">

                </div>
        </div>
    </main>
    <footer class="footer_container">
        <div class="content_wrapper">

        
        <div class="footer_container3">
            <div class="flex_box">
                <img class="devlogo" src="./pictures/devlogo3.png" alt="Developer Akademie Logo">
                <h1 class="developer_container">Developer Akademie</h1>
            </div>
            <p class="developer_container">c 2023 Developer Akademie GmbH</p>
            </div>
        </div>
    </footer>

    <dialog id="myDialog">
        <div class="button_dialog_container">
            <header>
                <h2 class="color_dialog2">Lio 1</h2>
            </header>
            <button class="x_color_button" onclick="closeDialog()">&#x2715</button>
        </div>
        <section class="section_dialog">
            <img class="vollbildclass" src="" alt="Husky im Schnee">
        </section>
        <footer class="footer_container2">
            <button class="color_button" onclick="changeImage(-1)">&#8592 </button>
            <p class="color_dialog">1/12</p>
            <button class="color_button" onclick="changeImage(1)">&#8594 </button>
        </footer>
    </dialog>

    <script src="script.js" async defer></script>
</body>

</html>
